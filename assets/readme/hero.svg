<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">中国法律与 AI 热点监控</title>
  <desc id="desc">把法院公众号与法律行业社媒线索分开采集、核验、去重和排序，生成每日五条可追溯简报的流程图。</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#15233b"/>
      <stop offset="1" stop-color="#0d1729"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#6f819a" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="28" fill="#091321"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <path d="M0 294 C190 244 300 400 510 337 S890 245 1200 304" fill="none" stroke="#2dd4bf" stroke-opacity=".18" stroke-width="2"/>

  <g id="title-block" transform="translate(64 58)">
    <rect x="0" y="0" width="148" height="30" rx="15" fill="#17394a" stroke="#2dd4bf" stroke-opacity=".5"/>
    <text x="18" y="21" fill="#9ae6dc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">EVIDENCE-FIRST</text>
    <text x="0" y="94" fill="#f6fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="50" font-weight="750">中国法律与 AI 热点监控</text>
    <text x="0" y="132" fill="#b7c7da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23">把法律行业信号变成一份可追溯的每日简报</text>
    <text x="0" y="177" fill="#8194aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">official evidence · practitioner signals · explainable ranking</text>

    <g transform="translate(0 219)">
      <circle cx="9" cy="9" r="7" fill="#2dd4bf"/>
      <text x="27" y="16" fill="#dce8f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">保留来源、时间、链接与核验状态</text>
      <circle cx="9" cy="46" r="7" fill="#fbbf24"/>
      <text x="27" y="53" fill="#dce8f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">社媒只作线索，不替代事实判断</text>
    </g>
  </g>

  <g id="process-proof" transform="translate(680 52)">
    <text x="0" y="0" fill="#7f95ac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">DAILY PIPELINE / 5 ITEMS MAX</text>

    <path d="M100 82 H171 M274 82 H344" fill="none" stroke="#5a718b" stroke-width="3" stroke-linecap="round"/>
    <path d="M165 76 L174 82 165 88 M338 76 L347 82 338 88" fill="none" stroke="#5a718b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 34)">
      <rect width="102" height="98" rx="14" fill="url(#panel)" stroke="#31506d"/>
      <rect x="15" y="17" width="30" height="30" rx="8" fill="#153d4b"/>
      <path d="M23 32h14M23 39h10" stroke="#7ee7d5" stroke-width="3" stroke-linecap="round"/>
      <text x="15" y="69" fill="#eef7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" font-weight="700">官方发布</text>
      <text x="15" y="87" fill="#8fa2b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15">法院公众号</text>
    </g>

    <g transform="translate(172 34)">
      <rect width="102" height="98" rx="14" fill="url(#panel)" stroke="#31506d"/>
      <rect x="15" y="17" width="30" height="30" rx="8" fill="#382f17"/>
      <path d="M22 40c8-12 18-12 25 0M24 30h0M42 30h0" fill="none" stroke="#fcd36c" stroke-width="3" stroke-linecap="round"/>
      <text x="15" y="69" fill="#eef7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" font-weight="700">社媒观察</text>
      <text x="15" y="87" fill="#8fa2b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15">法律 + AI 线索</text>
    </g>

    <g transform="translate(346 34)">
      <rect width="142" height="98" rx="14" fill="#112a36" stroke="#2dd4bf" stroke-opacity=".7"/>
      <text x="18" y="34" fill="#9ae6dc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">NORMALIZE</text>
      <path d="M20 54h98M20 68h70M20 82h88" stroke="#6fa0a9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="116" cy="68" r="7" fill="#2dd4bf"/>
    </g>

    <path d="M244 156 V186 H246 V204" fill="none" stroke="#5a718b" stroke-width="3" stroke-linecap="round"/>
    <path d="M240 198 L246 207 252 198" fill="none" stroke="#5a718b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 216)">
      <rect width="488" height="84" rx="16" fill="#101f33" stroke="#35516f"/>
      <rect x="16" y="16" width="52" height="52" rx="12" fill="#1f4b51"/>
      <text x="42" y="50" text-anchor="middle" fill="#c5fff4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="800">05</text>
      <text x="88" y="37" fill="#f4fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23" font-weight="700">每日阅读队列</text>
      <text x="88" y="61" fill="#9eb0c3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">必须关注 · AI 法律 · 行业信号 · 待核验</text>
      <circle cx="454" cy="42" r="13" fill="#2dd4bf"/>
      <path d="M448 42l5 5 9-11" fill="none" stroke="#09202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
